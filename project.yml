name: VinylOfTheDay
options:
  bundleIdPrefix: com.vinyl.day
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: '7'
    MARKETING_VERSION: '1.3.1'
targets:
  VinylOfTheDay:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: VINYL
        CFBundleURLTypes:
          - CFBundleURLName: com.vinyl.day.spotify
            CFBundleURLSchemes:
              - vinyl-of-day
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vinyl.day.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIApplicationSupportsDocumentBrowser: NO
    dependencies:
      - target: VinylWidget
        embed: true
  VinylWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: WidgetExtension
      - path: Shared
    info:
      path: WidgetExtension/Info.plist
      properties:
        CFBundleDisplayName: VINYL Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vinyl.day.app.widget
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
